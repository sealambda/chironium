enum ConceptContext {
  ALLERGY_INTOLERANCE
  CONDITION
  FOOD
  LAB_RESULT
  MEDICATION
}

enum PublicationStatus {
  "This resource is ready for normal use."
  ACTIVE

  "This resource is still under development and is not yet considered to be ready for normal use."
  DRAFT

  "This resource has been withdrawn or superseded and should no longer be used."
  RETIRED

  "The authoring system does not know which of the status values currently applies for this resource. Note: This concept is not to be used for 'other' - one of the listed statuses is presumed to apply, it's just not known which one."
  UNKNOWN
}

enum DurationUnit {
  "years"
  A

  "days"
  D

  "hours"
  H

  "minutes"
  MIN

  "months"
  MO

  "milliseconds"
  MS

  "seconds"
  S

  "weeks"
  WK
}

enum RequestPriority {
  "The request should be actioned as soon as possible - higher priority than urgent."
  ASAP

  "The request has normal priority."
  ROUTINE

  "The request should be actioned immediately - highest possible priority. E.g. an emergency."
  STAT

  "The request should be actioned promptly - higher priority than routine."
  URGENT
}

enum TaskIntent {
  "The request represents the view of an authorization instantiated by a fulfilling system representing the details of the fulfiller's intention to act upon a submitted order."
  FILLER_ORDER

  "An order created in fulfillment of a broader order that represents the authorization for a single activity occurrence. E.g. The administration of a single dose of a drug."
  INSTANCE_ORDER

  "The request represents a component or option for a RequestOrchestration that establishes timing, conditionality and\/or other constraints among a set of requests. Refer to RequestOrchestration for additional information on how this status is used."
  OPTION

  "The request represents a request\/demand and authorization for action by the requestor."
  ORDER

  "The request represents an original authorization for action."
  ORIGINAL_ORDER

  "The request represents an intention to ensure something occurs without providing an authorization for others to act."
  PLAN

  "The request is a suggestion made by someone\/something that does not have an intention to ensure it occurs and without providing an authorization to act."
  PROPOSAL

  "The request represents an automatically generated supplemental authorization for action based on a parent authorization together with initial results of the action taken against that parent authorization."
  REFLEX_ORDER

  "The intent is not known. When dealing with Task, it's not always known (or relevant) how the task was initiated - i.e. whether it was proposed, planned, ordered or just done spontaneously."
  UNKNOWN
}

enum TaskStatus {
  "The potential performer has agreed to execute the task but has not yet started work."
  ACCEPTED

  "The task was not completed."
  CANCELLED

  "The task has been completed."
  COMPLETED

  "The task is not yet ready to be acted upon."
  DRAFT

  "The task should never have existed and is retained only because of the possibility it may have been used."
  ENTERED_IN_ERROR

  "The task was attempted but could not be completed due to some error."
  FAILED

  "The task has been started but is not yet complete."
  IN_PROGRESS

  "The task has been started but work has been paused."
  ON_HOLD

  "The task is ready to be performed, but no action has yet been taken. Used in place of requested\/received\/accepted\/rejected when request assignment and acceptance is a given."
  READY

  "A potential performer has claimed ownership of the task and is evaluating whether to perform it."
  RECEIVED

  "The potential performer who claimed ownership of the task has decided not to execute it prior to performing any action."
  REJECTED

  "The task is ready to be acted upon and action is sought."
  REQUESTED
}

enum ObservationStatus {
  "Subsequent to being Final, the observation has been modified subsequent. This includes updates\/new information and corrections."
  AMENDED

  "The observation is unavailable because the measurement was not started or not completed (also sometimes called 'aborted')."
  CANCELLED

  "Subsequent to being Final, the observation has been modified to correct an error in the test result."
  CORRECTED

  "The observation has been withdrawn following previous final release. This electronic record should never have existed, though it is possible that real-world decisions were based on it. (If real-world activity has occurred, the status should be 'cancelled' rather than 'entered-in-error')."
  ENTERED_IN_ERROR

  "The observation is complete and there are no further actions needed. Additional information such as 'released', 'signed', etc. would be represented using Provenance which provides not only the act but also the actors and dates and other related data. These act states would be associated with an observation status of preliminary until they are all completed and then a status of final would be applied."
  FINAL

  "This is an initial or interim observation: data may be incomplete or unverified."
  PRELIMINARY

  "The existence of the observation is registered, but there is no result yet available."
  REGISTERED

  "The authoring\/source system does not know which of the status values currently applies for this observation. Note: This concept is not to be used for 'other' - one of the listed statuses is presumed to apply, but the authoring\/source system does not know which."
  UNKNOWN
}

enum MedicationStatementStatus {
  "The medication usage is draft or preliminary."
  DRAFT

  "Some of the actions that are implied by the medication usage may have occurred. For example, the patient may have taken some of the medication. Clinical decision support systems should take this status into account."
  ENTERED_IN_ERROR

  "The action of recording the medication statement is finished."
  RECORDED
}

enum GoalPriority {
  "Indicates that the goal is of considerable importance and should be a primary focus of care delivery."
  HIGH_PRIORITY

  "The goal is desirable but is not sufficiently important to devote significant resources to. Achievement of the goal may be sought when incidental to achieving other goals."
  LOW_PRIORITY

  "Indicates that the goal has a reasonable degree of importance and that concrete action should be taken towards the goal. Attainment is not as critical as high-priority goals."
  MEDIUM_PRIORITY
}

enum GoalCategory {
  "Goals related to the manner in which the subject acts."
  BEHAVIORAL

  "Goals related to the consumption of food and\/or beverages."
  DIETARY

  "Goals related to the practice of nursing or established by nurses."
  NURSING

  "Goals related to the mobility and\/or motor capability of the subject."
  PHYSIOTHERAPY

  "Goals related to the personal protection of the subject."
  SAFETY
}

enum GoalAchievementStatus {
  "The goal has been met."
  ACHIEVED

  "The goal is being sought, and is progressing."
  IMPROVING

  "The goal is being sought but has not yet been reached. (Also applies if the goal was reached in the past but there has been regression and the goal is again being sought)."
  IN_PROGRESS

  "The goal is being sought, but the trend is flat."
  NO_CHANGE

  "The goal has not been met and little to no progress towards target."
  NO_PROGRESS

  "The goal has not been met and there might or might not have been progress towards target."
  NOT_ACHIEVED

  "The goal is not possible to be met."
  NOT_ATTAINABLE

  "The goal has been met, but ongoing activity is needed to sustain the goal objective."
  SUSTAINING

  "The goal is being sought, but is regressing."
  WORSENING
}

enum GoalLifecycleStatus {
  "A proposed goal was accepted or acknowledged."
  ACCEPTED

  "The goal is being sought actively."
  ACTIVE

  "The goal has been abandoned."
  CANCELLED

  "The goal is no longer being sought."
  COMPLETED

  "The goal was entered in error and voided."
  ENTERED_IN_ERROR

  "The goal remains a long term objective but is no longer being actively pursued for a temporary period of time."
  ON_HOLD

  "A goal is planned for this patient."
  PLANNED

  "A goal is proposed for this patient."
  PROPOSED

  "A proposed goal was rejected."
  REJECTED
}

enum ConditionVerificationStatus {
  "There is sufficient diagnostic and\/or clinical evidence to treat this as a confirmed condition."
  CONFIRMED

  "One of a set of potential (and typically mutually exclusive) diagnoses asserted to further guide the diagnostic process and preliminary treatment."
  DIFFERENTIAL

  "The statement was entered in error and is not valid."
  ENTERED_IN_ERROR

  "This is a tentative diagnosis - still a candidate that is under consideration."
  PROVISIONAL

  "This condition has been ruled out by subsequent diagnostic and clinical evidence."
  REFUTED

  "There is not sufficient diagnostic and\/or clinical evidence to treat this as a confirmed condition."
  UNCONFIRMED
}

enum ConditionClinicalStatus {
  "The subject is currently experiencing the condition or situation, there is evidence of the condition or situation, or considered to be a significant risk."
  ACTIVE

  "The subject is no longer experiencing the condition or situation and there is no longer evidence or appreciable risk of the condition or situation."
  INACTIVE

  "The subject is experiencing a reoccurence or repeating of a previously resolved condition or situation, e.g. urinary tract infection, food insecurity."
  RECURRENCE

  "The subject is experiencing a return of a condition or situation after a period of improvement or remission, e.g. relapse of cancer, alcoholism."
  RELAPSE

  "The subject is not presently experiencing the condition or situation, but there is a risk of the condition or situation returning."
  REMISSION

  "The subject is not presently experiencing the condition or situation and there is a negligible perceived risk of the condition or situation returning."
  RESOLVED

  "The authoring\/source system does not know which of the status values currently applies for this condition. Note: This concept is not to be used for 'other' - one of the listed statuses is presumed to apply, but the authoring\/source system does not know which."
  UNKNOWN
}

enum AllergyIntoleranceType {
  "A propensity for hypersensitive reaction(s) to a substance. These reactions are most typically type I hypersensitivity, plus other 'allergy-like' reactions, including pseudoallergy."
  ALLERGY

  "A propensity for adverse reactions to a substance that is judged to be not allergic or 'allergy-like'. These reactions are typically (but not necessarily) non-immune. They are to some degree idiosyncratic and\/or patient-specific (i.e. are not a reaction that is expected to occur with most or all patients given similar circumstances)."
  INTOLERANCE
}

enum AllergyIntoleranceVerificationStatus {
  "The propensity for a reaction to the identified substance has been objectively verified (which may include clinical evidence by testing, rechallenge, or observation)."
  CONFIRMED

  "The statement was entered in error and is not valid."
  ENTERED_IN_ERROR

  "The available clinical information supports a high liklihood of the propensity for a reaction to the identified substance."
  PRESUMED

  "A propensity for a reaction to the identified substance has been disputed or disproven with a sufficient level of clinical certainty to justify invalidating the assertion. This might or might not include testing or rechallenge."
  REFUTED

  "The propensity for a reaction to the identified substance has not been objectively verified."
  UNCONFIRMED
}

enum AllergyIntoleranceClinicalStatus {
  "The subject is currently experiencing, or is at risk of, a reaction to the identified substance."
  ACTIVE

  "The subject is no longer at risk of a reaction to the identified substance."
  INACTIVE

  "A reaction to the identified substance has been clinically reassessed by testing or re-exposure and is considered no longer to be present. Re-exposure could be accidental, unplanned, or outside of any clinical setting."
  RESOLVED
}

enum AdministrativeGender {
  "Female"
  FEMALE

  "Male"
  MALE

  "Other"
  OTHER

  "Unknown"
  UNKNOWN
}

enum ContactPointSystem {
  "The value is an email address."
  EMAIL

  "The value is a fax machine. Use of full international numbers starting with + is recommended to enable automatic dialing support but not required."
  FAX

  "A contact that is not a phone, fax, page or email address and is not expressible as a URL. E.g. Internal mail address. This SHOULD NOT be used for contacts that are expressible as a URL (e.g. Skype, Twitter, Facebook, etc.) Extensions may be used to distinguish 'other' contact types."
  OTHER

  "The value is a pager number. These may be local pager numbers that are only usable on a particular pager system."
  PAGER

  "The value is a telephone number used for voice calls. Use of full international numbers starting with + is recommended to enable automatic dialing support but not required."
  PHONE

  "A contact that can be used for sending a sms message (e.g. mobile phones, some landlines)."
  SMS

  "A contact that is not a phone, fax, pager or email address and is expressed as a URL. This is intended for various institutional or personal contacts including web sites, blogs, Skype, Twitter, Facebook, etc. Do not use for email addresses."
  URL
}

enum ContactPointUse {
  "A communication contact point at a home; attempted contacts for business purposes might intrude privacy and chances are one will contact family or other household members instead of the person one wishes to call. Typically used with urgent cases, or if no other contacts are available."
  HOME

  "A telecommunication device that moves and stays with its owner. May have characteristics of all other use codes, suitable for urgent matters, not the first choice for routine business."
  MOBILE

  "This contact point is no longer in use (or was never correct, but retained for records)."
  OLD

  "A temporary contact point. The period can provide more detailed information."
  TEMP

  "An office contact point. First choice for business related contacts during business hours."
  WORK
}

enum NameUse {
  "Anonymous assigned name, alias, or pseudonym (used to protect a person's identity for privacy reasons)."
  ANONYMOUS

  "A name used prior to changing name because of marriage. This name use is for use by applications that collect and store names that were used prior to a marriage. Marriage naming customs vary greatly around the world, and are constantly changing. This term is not gender specific. The use of this term does not imply any particular history for a person's name."
  MAIDEN

  "A name that is used to address the person in an informal manner, but is not part of their formal or usual name."
  NICKNAME

  "The formal name as registered in an official (government) registry, but which name might not be commonly used. May be called 'legal name'."
  OFFICIAL

  "This name is no longer in use (or was never correct, but retained for records)."
  OLD

  "A temporary name. Name.period can provide more detailed information. This may also be used for temporary names assigned at birth or in emergency situations."
  TEMP

  "Known as\/conventional\/the one you normally use."
  USUAL
}

