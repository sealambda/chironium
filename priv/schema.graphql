type RootQueryType {
  currentUser: User

  user(
    "A filter to limit the results"
    filter: UserFilterInput
  ): User

  contract(
    "A filter to limit the results"
    filter: ContractFilterInput
  ): Contract

  contracts(
    "How to sort the records in the response"
    sort: [ContractSortInput]

    "A filter to limit the results"
    filter: ContractFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfContract

  "Lists customers for the authenticated user based on their role and organisation."
  customerList(
    "How to sort the records in the response"
    sort: [MembershipSortInput]

    "A filter to limit the results"
    filter: MembershipFilterInput

    organisationId: ID!
  ): [Membership!]!

  "Get a single organisation by unique identifier (id, name, or slug)."
  organisation(id: ID, name: String, slug: String): Organisation

  "Returns organisations the actor can access."
  organisations: [Organisation!]!

  person(
    "A filter to limit the results"
    filter: PersonFilterInput
  ): Person

  personProfile(
    "A filter to limit the results"
    filter: PersonProfileFilterInput
  ): PersonProfile

  personProfiles(
    "How to sort the records in the response"
    sort: [PersonProfileSortInput]

    "A filter to limit the results"
    filter: PersonProfileFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfPersonProfile
}

type RootMutationType {
  "Creates a contract for an existing person (for renewals)."
  createContract(input: CreateContractInput!): CreateContractResult!

  "Creates a contract by email. Finds or creates person, profile, and user."
  createContractByEmail(input: CreateContractByEmailInput!): CreateContractByEmailResult!

  activateContract(id: ID!): ActivateContractResult!

  pauseContract(id: ID!): PauseContractResult!

  resumeContract(id: ID!): ResumeContractResult!

  completeContract(id: ID!): CompleteContractResult!

  terminateContract(id: ID!): TerminateContractResult!

  "Creates a new organisation."
  createOrganisation(input: CreateOrganisationInput!): CreateOrganisationResult!

  "Creates a Person with provided data."
  createPerson(input: CreatePersonInput): CreatePersonResult!

  "Updates a Person's personal data."
  updatePerson(id: ID!, input: UpdatePersonInput): UpdatePersonResult!

  "Creates a profile for a person in an organisation."
  createPersonProfile(input: CreatePersonProfileInput!): CreatePersonProfileResult!

  "Updates profile preferences."
  updatePersonProfile(id: ID!, input: UpdatePersonProfileInput): UpdatePersonProfileResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json

"""
The `Date` scalar type represents a date. The Date appears in a JSON
response as an ISO8601 formatted string, without a time component.
"""
scalar Date
