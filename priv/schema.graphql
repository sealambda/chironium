type RootQueryType {
  "Retrieve the info for the actor that is currently signed in."
  currentActor: User

  listSubscriptions(
    "How to sort the records in the response"
    sort: [SubscriptionSortInput]

    "A filter to limit the results"
    filter: SubscriptionFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfSubscription

  getOrganization: Organization

  listOrganizations(
    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfOrganization

  getUser(
    "A filter to limit the results"
    filter: UserFilterInput
  ): User
}

type Money {
  amount: Decimal!
  currency: String!
}

input MoneyInput {
  amount: Decimal!
  currency: String!
}

type RootMutationType {
  createContact(input: CreateContactInput): CreateContactResult!

  "Create a contact with initial contact points (email, phone, ...)"
  createContactWithContactPoints(input: CreateContactWithContactPointsInput): CreateContactWithContactPointsResult!

  updateContact(id: ID!, input: UpdateContactInput): UpdateContactResult!

  createContactPoint(input: CreateContactPointInput!): CreateContactPointResult!

  updateContactPoint(id: ID!, input: UpdateContactPointInput): UpdateContactPointResult!

  createOrganization(input: CreateOrganizationInput!): CreateOrganizationResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json

"""
The `Date` scalar type represents a date. The Date appears in a JSON
response as an ISO8601 formatted string, without a time component.
"""
scalar Date

"""
The `Decimal` scalar type represents signed double-precision fractional
values parsed by the `Decimal` library. The Decimal appears in a JSON
response as a string to preserve precision.
"""
scalar Decimal
