name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like Chironium to support it?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your role (for example trainer, nutritionist, or physician) and any relevant standards, such as FHIR resources or terminologies.
