name: PR Validation

on:
  pull_request:
    branches: [main]
  # PRs can only restore caches saved on main, so main must run too.
  push:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOOGLE_CLIENT_ID: ci-dummy-google-client-id
  GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret

jobs:
  backend:
    name: backend (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          version-file: "mise.toml"
          version-type: "strict"

      - name: Cache Elixir deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Run backend tests
        run: mix test --partitions 4

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          version-file: "mise.toml"
          version-type: "strict"

      - name: Cache Elixir deps and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Prepare dev database
        run: mix ash.setup --quiet

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JS dependencies
        run: pnpm deps:audit

      - name: Generate GraphQL types
        run: pnpm assets:codegen

      # /portal/gql serves only the committed manifest, so it must match the portal's documents.
      - name: Check persisted portal documents
        run: |
          pnpm --dir assets gql:persisted
          git diff --exit-code priv/graphql/portal-documents.json

      - name: Build assets
        run: pnpm assets:build

      - name: Dead-code check (knip)
        run: pnpm assets:deadcode

      - name: Architecture check (dependency-cruiser)
        run: pnpm assets:arch

      - name: Run assets unit tests
        run: pnpm assets:test

      - name: Run assets E2E tests
        run: pnpm assets:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore
