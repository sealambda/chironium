name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chironium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_BASE: postgres://postgres:postgres@localhost:5432
      DATABASE_NAME_TEST: chironium_test
      DATABASE_NAME_DEV: chironium_dev
      DATABASE_URL_TEST: $DATABASE_URL_BASE/$DATABASE_NAME_TEST
      DATABASE_URL_DEV: $DATABASE_URL_BASE/$DATABASE_NAME_DEV
      PLAYWRIGHT_BASE_URL: http://localhost:4000
      PLAYWRIGHT_E2E_SECRET: local-playwright-e2e-secret-do-not-use-in-prod
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: "mise.toml"
          version-type: "strict"

      - name: Cache Elixir deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Create dev database
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE $DATABASE_NAME_DEV;" || true
        env:
          PGPASSWORD: postgres

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Run backend tests
        run: mix test

      - name: Prepare dev database
        run: mix ash.setup --quiet
        env:
          MIX_ENV: dev
          DATABASE_URL: $DATABASE_URL_DEV

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JS dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate GraphQL types
        run: pnpm assets:codegen

      - name: Build assets
        run: pnpm assets:build

      - name: Run assets unit tests
        run: pnpm assets:test

      - name: Install Playwright browser and OS deps
        run: pnpm --dir assets e2e:install

      - name: Start Phoenix server
        run: mix phx.server > /tmp/phoenix.log 2>&1 &
        env:
          MIX_ENV: dev
          DATABASE_URL: $DATABASE_URL_DEV

      - name: Wait for server
        run: |
          for i in {1..60}; do
            if curl -fsS -H "x-playwright-e2e-secret: $PLAYWRIGHT_E2E_SECRET" "$PLAYWRIGHT_BASE_URL/sign-in" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Phoenix server did not become ready in time."
          tail -n 200 /tmp/phoenix.log
          exit 1

      - name: Run assets E2E tests
        run: pnpm assets:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore
