name: PR Validation

on:
  pull_request:
    branches: [main]
  # PRs can only restore caches saved on main, so main must run too.
  push:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOOGLE_CLIENT_ID: ci-dummy-google-client-id
  GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret

jobs:
  backend:
    name: backend (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: "mise.toml"
          version-type: "strict"

      - name: Cache Elixir deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Run backend tests
        run: mix test --partitions 4

  frontend:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: "mise.toml"
          version-type: "strict"

      - name: Cache Elixir deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Compiling writes priv/schema.graphql, which GraphQL codegen reads.
      - name: Generate GraphQL schema
        run: |
          mix deps.get
          mix compile

      - name: Audit production JS dependencies
        run: pnpm deps:audit

      - name: Generate GraphQL types
        run: pnpm assets:codegen

      # /portal/gql serves only the committed manifest, so it must match the portal's documents.
      - name: Check persisted portal documents
        run: |
          pnpm --dir assets gql:persisted
          git diff --exit-code priv/graphql/portal-documents.json

      - name: Build assets
        run: pnpm assets:build

      - name: Dead-code check (knip)
        run: pnpm assets:deadcode

      - name: Architecture check (dependency-cruiser)
        run: pnpm assets:arch

      - name: Run assets unit tests
        run: pnpm assets:test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: "mise.toml"
          version-type: "strict"

      - name: Cache Elixir deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: "package.json"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Prepare dev database
        run: mix ash.setup --quiet

      - name: Build assets
        run: |
          pnpm assets:codegen
          pnpm assets:build

      - name: Run assets E2E tests
        run: pnpm assets:e2e

      # Also on success: retried (flaky) tests keep their first-attempt traces here.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: assets/playwright-report
          if-no-files-found: ignore
          retention-days: 7
