name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action never checks out or runs pull request code, so pull_request_target is safe here.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/sealambda/chironium/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],copilot-swe-agent[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thank you for your contribution. Before we can merge it, please read the [Contributor License Agreement](https://github.com/sealambda/chironium/blob/main/CLA.md) and sign it by posting the sentence below as a comment on this pull request."
