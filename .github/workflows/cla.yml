name: CLA Assistant

# The action never checks out or runs pull request code, so these triggers are safe here.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # The repository is archived; v2.6.1 is the final release.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 # zizmor: ignore[archived-uses]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/sealambda/chironium/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],copilot-swe-agent[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thank you for your contribution. Before we can merge it, please read the [Contributor License Agreement](https://github.com/sealambda/chironium/blob/main/CLA.md) and sign it by posting the sentence below as a comment on this pull request."
