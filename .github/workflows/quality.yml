name: Quality

# Lightweight static quality gates that do not need the Elixir build or a workspace
# install: Biome (lint/format/complexity/god-files) and jscpd (duplication).
# The build-dependent gates (typecheck, knip dead-code, dependency-cruiser architecture)
# run in pr-validation.yml, which already sets up the schema + generated files.

on:
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    name: Biome (lint · format · complexity · god-files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
      # Biome resolves the Tailwind stylesheet's @imports (tw-animate-css, shadcn) from
      # node_modules; without them it misorders and fails to parse those utility classes.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome check
        run: pnpm exec biome check .

  duplication:
    name: jscpd (copy-paste detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json
      - name: jscpd
        working-directory: assets
        run: pnpm dlx jscpd@5.0.9 src
