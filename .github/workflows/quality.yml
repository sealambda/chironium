name: Quality

# Lightweight static quality gates that do not need the Elixir build or a workspace
# install: Biome (lint/format/complexity/god-files) and jscpd (duplication).
# The build-dependent gates (typecheck, knip dead-code, dependency-cruiser architecture)
# run in pr-validation.yml, which already sets up the schema + generated files.

on:
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    name: Biome (lint · format · complexity · god-files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      # Biome resolves the Tailwind stylesheet's @imports (tw-animate-css, shadcn) from
      # node_modules; without them it misorders and fails to parse those utility classes.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome check
        run: pnpm exec biome check .

  duplication:
    name: jscpd (copy-paste detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: jscpd
        working-directory: assets
        run: pnpm dlx jscpd@5.0.9 src
