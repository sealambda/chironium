packages:
  - assets
  # Phoenix dependencies for workspace linking.
  - deps/phoenix
  - deps/phoenix_html
  - deps/phoenix_live_view

overrides:
  '@babel/core@7': ^7.29.1
  '@hono/node-server': ^1.19.15
  body-parser: ^2.3.0
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@>=3: ^5.0.9
  dompurify: ~3.4.13
  fast-uri: ^3.1.5
  hono: ^4.12.34
  ip-address: ^10.3.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  nanoid@3: ^3.3.18
  nodemailer: ^9.0.1
  postcss: ^8.5.23
  qs: ^6.15.2
  undici@7: ^7.29.0
  vite: ^8.0.16
  ws@8: ^8.21.3

auditConfig:
  # deps/phoenix's own devDep `documentation` pulls vue-template-compiler 2.x.
  # No patched release exists on that package name; not part of our build output.
  ignoreGhsas:
    - GHSA-g3ch-rx76-35fx

peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/eslint-plugin>typescript': '6'
    '@typescript-eslint/parser>typescript': '6'
    '@typescript-eslint/utils>typescript': '6'
    '@typescript-eslint/type-utils>typescript': '6'
    '@typescript-eslint/typescript-estree>typescript': '6'
    '@typescript-eslint/project-service>typescript': '6'
    '@typescript-eslint/tsconfig-utils>typescript': '6'
    eslint-plugin-jest>typescript: '6'
    '@typescript-eslint/eslint-plugin>eslint': '10'
    '@typescript-eslint/parser>eslint': '10'
    '@typescript-eslint/type-utils>eslint': '10'
    '@typescript-eslint/utils>eslint': '10'

minimumReleaseAgeExclude:
  - '@posthog/core@1.34.0'
  - '@posthog/types@1.388.0'
  - posthog-js@1.388.1
  - dompurify@3.4.13

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  msw: false
  protobufjs: false
  unrs-resolver: false

catalog:
  '@biomejs/biome': 2.4.13
