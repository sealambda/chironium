packages:
  - assets

# Security overrides: pin vulnerable transitive deps to fixed versions (osv-scanner SCA gate).
# Many originate from the shadcn CLI devDep chain (dev tooling, not app runtime). See osv-scanner.toml.
overrides:
  '@babel/core@7': ^7.29.6
  '@hono/node-server': ^1.19.15
  '@opentelemetry/core': ^2.8.0
  body-parser: ^2.4.0
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@>=3: ^5.0.9
  dompurify: ~3.4.16
  fast-uri: ^3.1.5
  hono: ^4.12.34
  ip-address: ^10.3.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  nanoid@3: ^3.3.18
  nodemailer: ^9.0.1
  postcss: ^8.5.23
  prosemirror-view: ^1.42.3
  protobufjs: ^7.6.3
  qs: ^6.15.2
  undici@7: ^7.29.0
  vite: ^8.0.16
  ws@8: ^8.21.3

minimumReleaseAgeExclude:
  - '@posthog/core@1.34.0'
  - '@posthog/types@1.388.0'
  - posthog-js@1.388.1
  - '@biomejs/biome@2.6.2'
  - '@biomejs/cli-android-arm64@2.6.2'
  - '@biomejs/cli-android-x64@2.6.2'
  - '@biomejs/cli-darwin-arm64@2.6.2'
  - '@biomejs/cli-darwin-x64@2.6.2'
  - '@biomejs/cli-linux-arm64-musl@2.6.2'
  - '@biomejs/cli-linux-arm64@2.6.2'
  - '@biomejs/cli-linux-x64-musl@2.6.2'
  - '@biomejs/cli-linux-x64@2.6.2'
  - '@biomejs/cli-win32-arm64@2.6.2'
  - '@biomejs/cli-win32-x64@2.6.2'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  lefthook: true
  msw: false
  protobufjs: false
  unrs-resolver: false

catalog:
  '@biomejs/biome': 2.6.2
